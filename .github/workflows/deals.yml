name: 딜 수집

on:
  # ⚠️ 2026-08-10 스케줄 비활성화.
  # 토스가 외국 IP(GitHub Actions 서버) 접근을 2차인증(TWO_FACTOR_REQUIRED)으로 막아
  # 이 클라우드 자동수집은 더 이상 동작하지 않는다. 수집은 한국 IP 인 내 PC 에서
  # '사이트갱신.cmd'(→ update_site.py) 로 돌린다.
  # schedule:
  #   - cron: "17 22,3,9,13 * * *"
  workflow_dispatch:        # 기록용(수동 실행해도 외국 IP라 수집은 실패함)

permissions:
  contents: write           # deals.db, docs/ 커밋용

concurrency:
  group: deals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: .env 구성
        env:
          TBIZAUTH: ${{ secrets.TBIZAUTH }}
          TGSID: ${{ secrets.TGSID }}
        run: |
          if [ -z "$TBIZAUTH" ]; then
            echo "::error::TBIZAUTH 시크릿이 비어 있습니다. Settings → Secrets 에 등록하세요."
            exit 1
          fi
          printf 'TBIZAUTH=%s\nTGSID=%s\n' "$TBIZAUTH" "$TGSID" > .env

      - name: 딜 수집
        # 토큰이 만료되면 여기서 401 로 실패한다.
        # 실패하면 GitHub 이 알림 메일을 보내고, 배포는 일어나지 않으므로
        # 사이트는 마지막 정상 버전이 그대로 유지된다.
        run: python collect.py

      - name: 쉐어링크 발급
        # 링크는 상품당 영구 고정이라 이미 있는 건 건너뛴다.
        run: python issue.py --limit 40

      - name: 사이트 생성
        run: python build.py

      - name: 카드 생성용 의존성 (Pillow + 한글폰트)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          python -m pip install --quiet pillow

      - name: 딜 카드 생성
        # 스레드/인스타용 정사각 카드 + 캡션을 docs/cards/ 에 만든다.
        run: python cards.py

      - name: 커밋 및 푸시
        # Vercel 이 이 푸시를 감지해 자동 배포한다.
        # deals.db 를 함께 커밋해야 링크 캐시와 가격 이력이 실행 사이에 이어진다.
        run: |
          git config user.name  "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add deals.db docs/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "딜 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
